name: Tarefa
description: Novo card do Kanban, executado pelas equipes de agentes
title: "[Tarefa] "
labels: ["tarefa"]
body:
  - type: markdown
    attributes:
      value: |
        Descreva **o resultado esperado**, não a implementação. O Líder Técnico decide como dividir o trabalho entre as equipes.
        Quando quiser que a tarefa seja executada, mova o card para **Pronto** no Kanban.
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que deve existir ou funcionar quando a tarefa estiver pronta? (1 a 3 frases)
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Condições testáveis, de preferência no formato "Dado… Quando… Então…", com números concretos.
      placeholder: |
        - Dado que tenho 10 moedas, quando compro o primeiro gerador (custo 10), então fico com 0 moedas e a produção passa a 1/s.
        - Dado que fiquei 8 horas offline, quando abro o jogo, então recebo os ganhos do período, limitados ao teto definido no GDD.
    validations:
      required: true
  - type: dropdown
    id: equipes
    attributes:
      label: Equipes envolvidas
      description: Se não souber, deixe em branco. O Líder define.
      multiple: true
      options:
        - Criativa (game design, UI/UX, arte, animação)
        - Front-end (cliente do jogo)
        - Back-end e banco de dados
        - Infra / DevOps
        - Publicação nas lojas
  - type: dropdown
    id: fase
    attributes:
      label: Fase
      options:
        - 1 - Escopo e ideia
        - 2 - Stack
        - 3 - Prototipagem
        - 4 - Desenvolvimento
        - 5 - Testes
        - 6 - Servidor web
        - 7 - Lojas
    validations:
      required: true
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options:
        - Alta
        - Média
        - Baixa
      default: 1
  - type: textarea
    id: contexto
    attributes:
      label: Contexto, referências e fora do escopo
      description: Links, imagens de referência, decisões já tomadas e o que NÃO faz parte desta tarefa.
